<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Hypergraph Isomorphism & Spectra</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
      --border: #e5e7eb;
      --pre-bg: #111827;
      --pre-text: #e5e7eb;
      --success: #10b981;
      --error: #ef4444;
    }

    body.dark-mode {
      --primary: #818cf8;
      --primary-hover: #6366f1;
      --bg: #111827;
      --card-bg: #1f2937;
      --text: #f9fafb;
      --border: #374151;
      --pre-bg: #000000;
      --pre-text: #34d399;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem 1rem;
      transition: background-color 0.3s, color 0.3s;
    }

    .container {
      max-width: 950px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      transition: background-color 0.3s;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
    }

    h2 { margin: 0; font-weight: 700; font-size: 1.5rem; }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    button, select {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      transition: background-color 0.2s;
    }
    
    button:hover { background-color: var(--primary-hover); }
    
    .btn-secondary { background-color: transparent; border: 1px solid var(--primary); color: var(--primary); }
    .btn-secondary:hover { background-color: var(--primary); color: white; }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    label { display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.9rem;}

    textarea {
      width: 100%;
      height: 120px;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: monospace;
      box-sizing: border-box;
      resize: vertical;
    }

    .action-btn { width: 100%; padding: 1rem; font-size: 1.1rem; margin-top: 1.5rem; font-weight: 600;}

    .result-box {
      background: var(--pre-bg);
      color: var(--pre-text);
      padding: 1.5rem;
      border-radius: 8px;
      font-family: monospace;
      white-space: pre-wrap;
      overflow-x: auto;
      margin-top: 0.5rem;
      line-height: 1.5;
    }

    .citation {
      margin-top: 1rem;
      padding: 1rem;
      background: rgba(125, 125, 125, 0.1);
      border-left: 4px solid var(--primary);
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
    }

    /* Visualization Canvas */
    .viz-container {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
      height: 350px;
    }
    .viz-box {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      position: relative;
      overflow: hidden;
    }
    .viz-title {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      background: var(--card-bg);
      padding: 2px 8px;
      border-radius: 4px;
      opacity: 0.9;
    }

    .loading { color: #f59e0b; font-weight: bold; animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.5; } }
    
    @media (max-width: 768px) {
      .grid-2, .viz-container { grid-template-columns: 1fr; flex-direction: column; height: auto;}
      .viz-box { height: 250px; }
    }
  </style>
</head>
<body>
<a href="../../index.html" aria-label="Back to all tools" style="position:sticky;top:8px;z-index:9999;display:inline-flex;gap:8px;margin:8px;padding:9px 13px;border:1px solid #8993a866;border-radius:999px;background:rgba(20,27,43,.92);color:#fff;text-decoration:none;font:600 13px/1.2 system-ui,sans-serif;box-shadow:0 4px 16px #0002">← All tools</a>


<div class="container">
  <div class="header">
    <h2>🔄 Hypergraph Isomorphism & Spectral Analyzer</h2>
    <button class="btn-secondary" onclick="toggleDarkMode()">🌓 Dark Mode</button>
  </div>

  <div class="controls">
    <select id="inputType" onchange="updatePlaceholders()">
      <option value="edges">Input Mode: Edge Sets</option>
      <option value="matrix">Input Mode: Incidence Matrix</option>
    </select>
    <button class="btn-secondary" onclick="loadSampleData()">✨ Load Sample Data</button>
  </div>

  <div class="grid-2">
    <div>
      <label for="input1">Graph A:</label>
      <textarea id="input1" placeholder="(1, 2), (2, 3, 4)..."></textarea>
    </div>
    <div>
      <label for="input2">Graph B:</label>
      <textarea id="input2" placeholder="(1, 2), (2, 3, 4)..."></textarea>
    </div>
  </div>

  <button class="action-btn" onclick="startAnalysis()">Run Analysis</button>

  <div style="margin-top: 2rem;">
    <label>Computation Results:</label>
    <div id="result" class="result-box">Waiting for input...</div>
  </div>

  <label style="margin-top: 2.5rem;">Bipartite Visualization (🔵 Vertices | 🟧 Hyperedges)</label>
  <div class="viz-container">
    <div id="viz1" class="viz-box"><div class="viz-title">Graph A</div></div>
    <div id="viz2" class="viz-box"><div class="viz-title">Graph B</div></div>
  </div>
</div>

<script>
// --- UI & Input Handling ---

function toggleDarkMode() {
  document.body.classList.toggle('dark-mode');
}

function updatePlaceholders() {
  const type = document.getElementById("inputType").value;
  const t1 = document.getElementById("input1");
  const t2 = document.getElementById("input2");
  if (type === 'edges') {
    t1.placeholder = t2.placeholder = "(1, 2, 3), (3, 4), (1, 4)...";
  } else {
    t1.placeholder = t2.placeholder = "[[1,1,0],\n [0,1,1]]";
  }
}

function loadSampleData() {
  const type = document.getElementById("inputType").value;
  if (type === 'edges') {
    document.getElementById("input1").value = "(1, 2, 3), (3, 4), (1, 4)";
    document.getElementById("input2").value = "(A, B, C), (C, D), (A, D)";
  } else {
    document.getElementById("input1").value = "[[1,1,0],\n [1,0,1],\n [0,1,1]]";
    document.getElementById("input2").value = "[[0,1,1],\n [1,1,0],\n [1,0,1]]";
  }
}

function parseInput(input, type) {
  if (type === 'edges') {
    const edges = [];
    const regex = /\(([^()]+)\)/g;
    let match;
    while ((match = regex.exec(input)) !== null) {
      edges.push(match[1].split(',').map(str => str.trim())); 
    }
    return edges.length > 0 ? edges : null;
  } else {
    try {
      const matrix = JSON.parse(input.replace(/'/g, '"').replace(/(\r\n|\n|\r)/gm, ""));
      const edges = [];
      const numEdges = matrix[0].length;
      for (let col = 0; col < numEdges; col++) {
        const edge = [];
        for (let row = 0; row < matrix.length; row++) {
          if (matrix[row][col] === 1) edge.push(row.toString());
        }
        if (edge.length > 0) edges.push(edge);
      }
      return edges;
    } catch (e) {
      return null;
    }
  }
}

// --- D3 Visualization (Bipartite Graph) ---

function drawBipartiteGraph(edges, containerId) {
  const container = d3.select("#" + containerId);
  container.selectAll("svg").remove();
  
  if (!edges || edges.length === 0) return;

  const width = container.node().getBoundingClientRect().width || 400;
  const height = container.node().getBoundingClientRect().height || 350;

  const nodes = [];
  const links = [];
  const vertexSet = new Set();

  edges.forEach((edge, i) => {
    const edgeId = `E${i+1}`;
    nodes.push({ id: edgeId, type: 'edge' });
    edge.forEach(v => {
      vertexSet.add(v);
      links.push({ source: v, target: edgeId });
    });
  });

  vertexSet.forEach(v => nodes.push({ id: v, type: 'vertex' }));

  const svg = container.append("svg")
    .attr("width", "100%")
    .attr("height", "100%")
    .attr("viewBox", `0 0 ${width} ${height}`);

  const simulation = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(60))
    .force("charge", d3.forceManyBody().strength(-200))
    .force("center", d3.forceCenter(width / 2, height / 2));

  const link = svg.append("g")
    .selectAll("line")
    .data(links)
    .join("line")
    .attr("stroke", "var(--border)")
    .attr("stroke-width", 2);

  const node = svg.append("g")
    .selectAll("g")
    .data(nodes)
    .join("g")
    .call(drag(simulation));

  // Vertices (Blue Circles)
  node.filter(d => d.type === 'vertex')
    .append("circle")
    .attr("r", 14)
    .attr("fill", "#3b82f6")
    .attr("stroke", "#2563eb")
    .attr("stroke-width", 2);

  // Hyperedges (Orange Squares)
  node.filter(d => d.type === 'edge')
    .append("rect")
    .attr("width", 24)
    .attr("height", 24)
    .attr("x", -12)
    .attr("y", -12)
    .attr("fill", "#f97316")
    .attr("stroke", "#ea580c")
    .attr("stroke-width", 2)
    .attr("rx", 4);

  node.append("text")
    .text(d => d.id)
    .attr("x", 18)
    .attr("y", 5)
    .style("font-size", "12px")
    .style("font-weight", "600")
    .style("fill", "var(--text)");

  simulation.on("tick", () => {
    link
      .attr("x1", d => Math.max(15, Math.min(width - 15, d.source.x)))
      .attr("y1", d => Math.max(15, Math.min(height - 15, d.source.y)))
      .attr("x2", d => Math.max(15, Math.min(width - 15, d.target.x)))
      .attr("y2", d => Math.max(15, Math.min(height - 15, d.target.y)));
    node.attr("transform", d => `translate(${Math.max(15, Math.min(width - 15, d.x))},${Math.max(15, Math.min(height - 15, d.y))})`);
  });

  function drag(simulation) {
    function dragstarted(event) {
      if (!event.active) simulation.alphaTarget(0.3).restart();
      event.subject.fx = event.subject.x;
      event.subject.fy = event.subject.y;
    }
    function dragged(event) {
      event.subject.fx = event.x;
      event.subject.fy = event.y;
    }
    function dragended(event) {
      if (!event.active) simulation.alphaTarget(0);
      event.subject.fx = null;
      event.subject.fy = null;
    }
    return d3.drag().on("start", dragstarted).on("drag", dragged).on("end", dragended);
  }
}

// --- Inline Web Worker for Computation ---

const workerCode = `
  // 1. Banerjee (2021) Adjacency Matrix Calculation
  function getAdjacencyMatrix(edges) {
    let vertices = new Set();
    edges.forEach(e => e.forEach(v => vertices.add(v)));
    const vList = Array.from(vertices).sort();
    const n = vList.length;
    
    const adj = Array.from({ length: n }, () => Array(n).fill(0));
    
    // A_ij = sum_{e in E_ij} (1 / (|e| - 1))
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        let sumWeights = 0;
        const v1 = vList[i];
        const v2 = vList[j];
        
        edges.forEach(edge => {
          if (edge.includes(v1) && edge.includes(v2) && edge.length > 1) {
            sumWeights += (1 / (edge.length - 1));
          }
        });
        
        adj[i][j] = adj[j][i] = sumWeights;
      }
    }
    return { matrix: adj, labels: vList };
  }

  // 2. Power Iteration for Spectral Radius
  function getSpectralRadius(adjMatrix) {
    const n = adjMatrix.length;
    if (n === 0) return 0;
    
    let b = new Array(n).fill(1).map(() => Math.random());
    
    for (let iter = 0; iter < 50; iter++) {
      let nextB = new Array(n).fill(0);
      for (let i = 0; i < n; i++) {
        for (let j = 0; j < n; j++) nextB[i] += adjMatrix[i][j] * b[j];
      }
      let norm = Math.sqrt(nextB.reduce((sum, val) => sum + val * val, 0));
      if (norm === 0) return 0;
      b = nextB.map(v => v / norm);
    }
    
    return b.reduce((acc, v, i) => acc + v * (adjMatrix[i].reduce((sum, val, j) => sum + val * b[j], 0)), 0);
  }

  // 3. Pruning Heuristics (Vertex Signatures)
  function getSignatures(edges) {
    const sigs = {};
    for (const edge of edges) {
      for (const v of edge) {
        if (!sigs[v]) sigs[v] = { degree: 0, edgeSum: 0 };
        sigs[v].degree += 1;
        sigs[v].edgeSum += edge.length; 
      }
    }
    const grouped = {};
    for (const [v, data] of Object.entries(sigs)) {
      const key = data.degree + '-' + data.edgeSum;
      if (!grouped[key]) grouped[key] = [];
      grouped[key].push(v);
    }
    return grouped;
  }

  // 4. Permutations and Matching
  function permute(arr) {
    if (arr.length <= 1) return [arr];
    const result = [];
    for (let i = 0; i < arr.length; i++) {
      const rest = [...arr.slice(0, i), ...arr.slice(i + 1)];
      for (const p of permute(rest)) {
        result.push([arr[i], ...p]);
      }
    }
    return result;
  }

  function edgesMatch(edges1, edges2, mapping) {
    const transformed = new Set(
      edges1.map(edge => JSON.stringify(edge.map(v => mapping[v]).sort()))
    );
    const target = new Set(
      edges2.map(edge => JSON.stringify(edge.slice().sort()))
    );
    if (transformed.size !== target.size) return false;
    for (let item of transformed) {
      if (!target.has(item)) return false;
    }
    return true;
  }

  // Main Worker Thread logic
  self.onmessage = function(e) {
    const { edges1, edges2 } = e.data;
    
    // --- SPECTRAL ANALYSIS ---
    const adjData1 = getAdjacencyMatrix(edges1);
    const adjData2 = getAdjacencyMatrix(edges2);
    const spec1 = getSpectralRadius(adjData1.matrix);
    const spec2 = getSpectralRadius(adjData2.matrix);
    
    const metrics = {
      spec1: spec1.toFixed(5),
      spec2: spec2.toFixed(5),
      adj1: adjData1.matrix,
      labels1: adjData1.labels
    };

    // --- ISOMORPHISM CHECK ---
    if (edges1.length !== edges2.length) {
      postMessage({ error: "Different number of hyperedges.", metrics });
      return;
    }

    const groups1 = getSignatures(edges1);
    const groups2 = getSignatures(edges2);

    const keys1 = Object.keys(groups1).sort();
    const keys2 = Object.keys(groups2).sort();

    if (JSON.stringify(keys1) !== JSON.stringify(keys2)) {
      postMessage({ error: "Signature heuristic mismatch (degrees or edge-size sums differ).", metrics });
      return;
    }

    const allPerms = [];
    function helper(i, currentMap) {
      if (i === keys1.length) {
        allPerms.push(currentMap);
        return;
      }
      const key = keys1[i];
      const g1 = groups1[key];
      const g2 = groups2[key];
      
      if (g1.length !== g2.length) return;

      for (const p of permute(g2)) {
        const newMap = { ...currentMap };
        for (let j = 0; j < g1.length; j++) {
          newMap[g1[j]] = p[j];
        }
        helper(i + 1, newMap);
      }
    }

    helper(0, {});

    for (const mapping of allPerms) {
      if (edgesMatch(edges1, edges2, mapping)) {
        postMessage({ success: true, mapping, metrics });
        return;
      }
    }

    postMessage({ error: "No valid relabeling mapping found.", metrics });
  };
`;

const blob = new Blob([workerCode], { type: 'application/javascript' });
const workerUrl = URL.createObjectURL(blob);

// --- Formatter Helper ---
function formatMatrix(matrix) {
  return matrix.map(row => 
    "[" + row.map(val => val.toFixed(2).padStart(5, ' ')).join(', ') + "]"
  ).join('\n');
}

// --- Main Thread Execution ---

function startAnalysis() {
  const type = document.getElementById("inputType").value;
  const resultBox = document.getElementById("result");
  
  const edges1 = parseInput(document.getElementById("input1").value, type);
  const edges2 = parseInput(document.getElementById("input2").value, type);

  if (!edges1 || !edges2) {
    resultBox.innerHTML = "<span style='color: var(--error)'>❌ Error: Invalid input format. Please check your syntax.</span>";
    return;
  }

  // Draw visualizations
  drawBipartiteGraph(edges1, "viz1");
  drawBipartiteGraph(edges2, "viz2");

  resultBox.innerHTML = '<span class="loading">Computing Adjacency, Spectra, and Isomorphisms...</span>';

  const worker = new Worker(workerUrl);
  
  worker.onmessage = function(e) {
    const { error, success, mapping, metrics } = e.data;
    
    let htmlOutput = "";
    
    if (success) {
      htmlOutput += `<span style="color: var(--success); font-weight: bold; font-size: 1.2rem;">✅ Graphs are Isomorphic!</span>\n\n`;
      htmlOutput += `Relabeling Map (A -> B):\n${JSON.stringify(mapping, null, 2)}\n\n`;
    } else {
      htmlOutput += `<span style="color: var(--error); font-weight: bold; font-size: 1.2rem;">❌ Not Isomorphic</span>\n`;
      htmlOutput += `Reason: ${error}\n\n`;
    }

    htmlOutput += `--- Spectral Metrics ---\n`;
    htmlOutput += `Spectral Radius A: ${metrics.spec1}\n`;
    htmlOutput += `Spectral Radius B: ${metrics.spec2}\n\n`;
    
    htmlOutput += `Adjacency Matrix A (Labels: ${metrics.labels1.join(', ')}):\n`;
    htmlOutput += formatMatrix(metrics.adj1);

    htmlOutput += `\n
<div class="citation">
  <strong>📖 Reference:</strong><br>
  Banerjee, A. (2021). <em>On the spectrum of hypergraphs.</em><br>
  Linear Algebra and its Applications, 614, 82–110.<br>
  <a href="https://doi.org/10.1016/j.laa.2021.02.015" target="_blank" style="color: var(--primary)">https://doi.org/10.1016/j.laa.2021.02.015</a>
</div>`;

    resultBox.innerHTML = htmlOutput;
    worker.terminate();
  };

  worker.postMessage({ edges1, edges2 });
}
</script>

</body>
</html>
