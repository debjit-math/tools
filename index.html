<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8fc"><meta name="description" content="A collection of interactive tools."><title>tools</title>
<style>
:root{color-scheme:light;--bg:#f7f8fc;--panel:#fff;--text:#171923;--muted:#737789;--line:#e5e7ef;--accent:#6257e8;--hover:#f0efff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .2s,color .2s}body.dark{color-scheme:dark;--bg:#101116;--panel:#191b24;--text:#f4f5fb;--muted:#a0a4b5;--line:#303340;--accent:#aaa1ff;--hover:#292637}.wrap{width:min(960px,calc(100% - 32px));margin:auto;padding:26px 0 36px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:52px}.brand{font-weight:750;font-size:21px;letter-spacing:-.06em;text-decoration:none;color:var(--text)}.theme{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);font-size:18px;cursor:pointer}.search{width:100%;padding:15px 17px;border:1px solid var(--line);border-radius:13px;background:var(--panel);color:var(--text);font:inherit;outline:none;margin-bottom:22px}.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{min-height:84px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px;border:1px solid var(--line);border-radius:13px;background:var(--panel);text-decoration:none;color:var(--text);transition:border-color .15s,transform .15s}.card:hover{border-color:var(--accent);transform:translateY(-2px)}.card h2{font-size:14px;font-weight:600;line-height:1.4;margin:0}.arrow{color:var(--muted);font-size:18px}.empty{display:none;color:var(--muted);padding:30px 2px}.foot{color:var(--muted);font-size:12px;margin-top:30px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.top{margin-bottom:34px}}@media(max-width:440px){.wrap{width:calc(100% - 24px);padding-top:18px}.grid{grid-template-columns:1fr}.card{min-height:68px;padding:15px}}
</style></head><body><main class="wrap"><nav class="top"><a class="brand" href="./">tools.</a><button class="theme" id="theme" aria-label="Toggle dark mode" title="Toggle dark mode">☾</button></nav><input class="search" id="search" type="search" placeholder="Search tools…" aria-label="Search tools" autocomplete="off"><section class="grid" id="grid" aria-label="Tools"></section><div class="empty" id="empty">No tools found.</div><div class="foot"><span id="count">9</span> tools</div></main>
<script>
const grid=document.getElementById('grid'),search=document.getElementById('search'),empty=document.getElementById('empty'),count=document.getElementById('count');let tools=[];
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=search.value.trim().toLowerCase();const shown=tools.filter(t=>[t.name,t.description,t.category,...(t.tags||[])].join(' ').toLowerCase().includes(q));grid.innerHTML=shown.map(t=>`<a class="card" href="tools/${encodeURIComponent(t.slug)}/index.html"><h2>${esc(t.name)}</h2><span class="arrow" aria-hidden="true">↗</span></a>`).join('');count.textContent=shown.length;empty.style.display=shown.length?'none':'block';grid.style.display=shown.length?'grid':'none'}
search.addEventListener('input',render);
const theme=document.getElementById('theme');if(localStorage.getItem('tools-theme')==='dark')document.body.classList.add('dark');function updateThemeIcon(){theme.textContent=document.body.classList.contains('dark')?'☀':'☾'}updateThemeIcon();theme.addEventListener('click',()=>{document.body.classList.toggle('dark');localStorage.setItem('tools-theme',document.body.classList.contains('dark')?'dark':'light');updateThemeIcon()});
const builtInTools = [
  {"name":"Hypergraph Studio","slug":"hypergraph-studio","category":"Hypergraph","description":"Build, visualize, and analyze hypergraphs with interactive graph views, permutations, automorphisms, matrices, and spectral information.","icon":"◈","tags":["visualization","graph","mathematics","hypergraph"]},
  {"name":"Isomorphism & Spectral Analyzer","slug":"hypergraph-isomorphism-spectral-analyzer","category":"Hypergraph","description":"Compare hypergraphs for isomorphism and inspect spectral invariants with interactive analysis.","icon":"⌘","tags":["isomorphism","spectrum","comparison","hypergraph"]},
  {"name":"Hypergraph Edge Orbits","slug":"hypergraph-edge-orbits","category":"Hypergraph","description":"Generate edge-orbit tables under vertex permutations and explore the orbit graph interactively.","icon":"◎","tags":["orbits","permutation","edges","hypergraph"]},
  {"name":"Transversal & Hitting-Set Solver","slug":"transversal-hitting-set-solver","category":"Hypergraph","description":"Find minimum transversals and enumerate minimal hitting sets, with edge coverage inspection.","icon":"⊹","tags":["solver","transversal","hitting set","hypergraph"]},
  {"name":"Hypergraph Coloring Solver","slug":"hypergraph-coloring-solver","category":"Hypergraph","description":"Explore weak and strong vertex colorings and search for colorings with fewer colors.","icon":"▦","tags":["coloring","solver","vertices","hypergraph"]},
  {"name":"Automorphism Group Explorer","slug":"automorphism-group-explorer","category":"Hypergraph","description":"Explore vertex symmetries, calculate automorphism group order, and identify vertex orbits.","icon":"⟳","tags":["symmetry","automorphism","group","hypergraph"]},
  {"name":"Matching & Packing Solver","slug":"matching-packing-solver","category":"Hypergraph","description":"Find maximum or maximal matchings and inspect selected edges, with JSON export.","icon":"⛓","tags":["matching","packing","solver","hypergraph"]},
  {"name":"Turing Lab — Machine Simulator","slug":"turing-machine-simulator","category":"Computer Science","description":"Build deterministic Turing machines, edit transition rules, and watch tape execution step by step.","icon":"δ","tags":["turing machine","automata","computation","simulator","computer science"]},
  {"name":"Probability, PMF & Entropy Lab","slug":"probability-pmf-entropy-lab","category":"Mathematics","description":"Explore probability mass functions, entropy, sums of random variables, and convolution with live charts.","icon":"∑","tags":["probability","pmf","entropy","convolution","statistics"]}
];
function showTools(data){tools=data;render()}
showTools(builtInTools);
fetch('./tools.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{if(Array.isArray(data)&&data.length)showTools(data)}).catch(()=>{});
</script></body></html>
